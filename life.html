<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life — Ananth Namboothiry</title>
  <meta name="description" content="A physics playground of photos — grab, fling, and open them." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%231A1915'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Life: full-viewport physics stage ── */
    body { overflow: hidden; }

    #life-stage {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      overflow: hidden;
      contain: layout style;
      touch-action: none;
      /* keep card z-indexes inside the stage so they never cover the UI */
      isolation: isolate;
    }

    #life-hint {
      position: absolute;
      bottom: 1.8rem; left: 50%;
      transform: translateX(-50%);
      font-family: var(--f-mono);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      color: var(--ink-2);
      background: rgba(245, 244, 240, 0.88);
      padding: 0.4rem 0.85rem;
      pointer-events: none;
      transition: opacity 1.2s ease;
      white-space: nowrap;
      max-width: calc(100vw - 2rem);
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 600;
    }
    #life-hint.gone { opacity: 0; }

    #scatter-btn {
      position: fixed;
      bottom: 1.8rem; right: 1.8rem;
      font-family: var(--f-mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--ink-2);
      background: rgba(245, 244, 240, 0.88);
      border: 1px solid #C9C6BA;
      padding: 0.6rem 1rem;
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
      z-index: 700;
    }
    #scatter-btn:hover { color: var(--ink); border-color: var(--ink-2); }

    /* photo cards */
    .photo-card {
      position: absolute;
      left: 0; top: 0;
      width: 155px;
      background: #FFFFFF;
      padding: 0.55rem 0.55rem 2.4rem;
      box-shadow: 0 2px 16px rgba(26, 25, 21, 0.13);
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transition: box-shadow 0.15s;
    }
    .photo-card.grabbed {
      cursor: grabbing;
      box-shadow: 0 14px 40px rgba(26, 25, 21, 0.28);
    }
    .photo-card:focus-visible {
      outline: 2px solid var(--ink-2);
      outline-offset: 2px;
    }
    .pc-img {
      width: 100%;
      aspect-ratio: 1;
      background: #EFEEE9;
      overflow: hidden;
    }
    .pc-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .pc-cap {
      font-family: var(--f-mono);
      font-size: 0.58rem;
      letter-spacing: 0.04em;
      color: var(--ink-3);
      text-align: center;
      line-height: 1.4;
      position: absolute;
      bottom: 0.55rem;
      left: 0.5rem; right: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(245, 244, 240, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      padding: 2rem;
    }
    #lightbox.hidden { display: none; }
    #lb-img {
      max-width: min(88vw, 820px);
      max-height: 78vh;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(26, 25, 21, 0.25);
      display: block;
      background: #EFEEE9;
    }
    #lb-cap {
      font-family: var(--f-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--ink-2);
      margin-top: 1.1rem;
      text-align: center;
    }
    #lb-close {
      position: fixed;
      top: 0.5rem; right: 0.6rem;
      background: none; border: none;
      color: var(--ink-2);
      font-size: 1rem;
      padding: 0.9rem;
      cursor: pointer;
      transition: color 0.15s;
      z-index: 9001;
    }
    #lb-close:hover { color: var(--ink); }
    #lb-nav {
      position: fixed;
      bottom: 1.4rem;
      font-family: var(--f-mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--ink-3);
    }
  </style>
</head>
<body>

  <nav>
    <div class="wrap wrap--wide nav-inner">
      <ul class="nav-links">
        <li><a href="index.html">about</a></li>
        <li><a href="index.html#experience">experience</a></li>
        <li><a href="life.html" class="active">life</a></li>
        <li><a href="poker.html">poker</a></li>
      </ul>
    </div>
  </nav>

  <!-- Physics stage -->
  <main id="life-stage" aria-label="Photo playground">
    <div id="life-hint">move your mouse &nbsp;·&nbsp; grab &amp; fling &nbsp;·&nbsp; click to open</div>
  </main>

  <button id="scatter-btn">scatter ↻</button>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button id="lb-close" aria-label="Close">✕</button>
    <img id="lb-img" src="" alt="" />
    <p id="lb-cap"></p>
    <p id="lb-nav">esc or click outside to close</p>
  </div>

  <script src="js/life.js"></script>
</body>
</html>
