<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poker — Ananth Namboothiry</title>
  <meta name="description" content="Poker session log — stats, cumulative P&L, and session history." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%231A1915'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav>
    <div class="wrap wrap--wide nav-inner">
      <ul class="nav-links">
        <li><a href="index.html">about</a></li>
        <li><a href="index.html#experience">experience</a></li>
        <li><a href="life.html">life</a></li>
        <li><a href="poker.html" class="active">poker</a></li>
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="wrap wrap--wide">

      <section class="section">
        <h2 class="label">Poker Log</h2>

        <!-- Stats -->
        <div class="poker-stats" id="poker-stats">
          <div class="stat-block">
            <span class="stat-value" id="stat-sessions">—</span>
            <span class="stat-label">sessions</span>
          </div>
          <div class="stat-block">
            <span class="stat-value" id="stat-pnl">—</span>
            <span class="stat-label">net p&amp;l</span>
          </div>
          <div class="stat-block">
            <span class="stat-value" id="stat-roi">—</span>
            <span class="stat-label">roi</span>
          </div>
        </div>

        <!-- Chart -->
        <div class="chart-wrap">
          <canvas id="poker-chart"></canvas>
          <div id="chart-tooltip" class="chart-tooltip"></div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table id="poker-table">
            <thead>
              <tr>
                <th data-col="game"     class="sortable">Game <span class="si">↕</span></th>
                <th data-col="venue"    class="sortable">Venue <span class="si">↕</span></th>
                <th data-col="buy_in"   class="sortable num">Buy-in <span class="si">↕</span></th>
                <th data-col="cash_out" class="sortable num">Cash-out <span class="si">↕</span></th>
                <th data-col="profit"   class="sortable num">Profit <span class="si">↕</span></th>
              </tr>
            </thead>
            <tbody id="poker-tbody"></tbody>
          </table>
        </div>

      </section>

    </div>
  </main>

  <script src="js/poker.js"></script>
</body>
</html>
